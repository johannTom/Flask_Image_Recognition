repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: pylint
        name: Pylint application
        entry: python -m pylint --rcfile=.pylintrc app.py model.py
        language: system
        files: '^(app|model)\.py$'
        pass_filenames: false
